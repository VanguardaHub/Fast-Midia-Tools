# RNF-02 (varredura de segredos) · RNF-11 (revisão por PR, testes automatizados, pipeline de CI)
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (CLI oficial, sem licença)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  web:
    name: Web — lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migracoes:
    name: Migrações — sintaxe SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica ordem e nomes das migrações
        run: |
          ls supabase/migrations/*.sql | sort -c
          for f in supabase/migrations/*.sql; do test -s "$f" || (echo "vazio: $f" && exit 1); done
